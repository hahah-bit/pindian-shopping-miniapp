server {
 listen 443 ssl;
 server_name _;
 ssl_certificate /run/tls/fullchain.pem;
 ssl_certificate_key /run/tls/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 client_max_body_size 8m;
 location /api/ { proxy_pass http://api:3000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_buffering off; proxy_connect_timeout 5s; proxy_read_timeout 65s; }
 location / { proxy_pass http://admin:80; proxy_set_header Host $host; }
}
server { listen 8080; location = /health { return 200 'ok'; } }
