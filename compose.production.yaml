# 独立生产拓扑，不能与 compose.simulation.yaml 合并。
x-runtime: &runtime
  APP_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-pindian}:${POSTGRES_PASSWORD:?必须配置数据库密码}@postgres:5432/${POSTGRES_DB:-pindian}
  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?必须配置公网HTTPS}
  CORS_ORIGINS: ${CORS_ORIGINS:?必须配置后台origin}
  WX_APPID: ${WX_APPID:?必须配置appid}
  WX_APP_SECRET: ${WX_APP_SECRET:?必须配置secret}
  WX_PAY_MCHID: ${WX_PAY_MCHID:?必须配置商户号}
  WX_PAY_APIV3_KEY: ${WX_PAY_APIV3_KEY:?必须配置APIv3密钥}
  WX_PAY_SERIAL_NO: ${WX_PAY_SERIAL_NO:?必须配置序列号}
  WX_PAY_PRIVATE_KEY_PATH: /run/wechat/merchant-private.pem
  WX_PAY_PLATFORM_PUBLIC_KEY_PATH: /run/wechat/platform-public.pem
  WX_PAY_NOTIFY_URL: ${WX_PAY_NOTIFY_URL:?必须配置HTTPS回调}
  WX_API_BASE_URL: ${WX_API_BASE_URL:-}
  WX_PAY_ENDPOINT_BASE: ${WX_PAY_ENDPOINT_BASE:-}
  SIMULATION_CONTROL_TOKEN: ${SIMULATION_CONTROL_TOKEN:-}
  CS_FIRST_RESPONSE_TIMEOUT_MINUTES: ${CS_FIRST_RESPONSE_TIMEOUT_MINUTES:-15}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pindian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须配置数据库密码}
      POSTGRES_DB: ${POSTGRES_DB:-pindian}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    image: ${RELEASE_IMAGE:?必须指定固定版本镜像}
    environment:
      <<: *runtime
      PORT: '3000'
      MEDIA_DIR: /var/lib/pindian/media
    volumes:
      - media-data:/var/lib/pindian/media
      - ${WECHAT_KEYS_DIR:?必须配置密钥目录}:/run/wechat:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, infra/docker/health-api.cjs]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    init: true
    restart: unless-stopped
  worker:
    image: ${RELEASE_IMAGE:?必须指定固定版本镜像}
    command: [node, backend/dist/bootstrap/worker.js]
    environment: *runtime
    volumes:
      - ${WECHAT_KEYS_DIR:?必须配置密钥目录}:/run/wechat:ro
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, infra/docker/health-worker.cjs]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    init: true
    restart: unless-stopped
  admin:
    image: ${ADMIN_RELEASE_IMAGE:?必须指定固定版本镜像}
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/api/health/ready']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  gateway:
    image: nginx:stable-alpine
    ports: ['${HTTPS_BIND:-0.0.0.0:443}:443']
    volumes:
      - ./infra/release/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:?必须配置TLS目录}:/run/tls:ro
    depends_on:
      admin: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  postgres-data:
  media-data:
