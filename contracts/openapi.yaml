components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 管理员会话 token（admin 域）
    miniUserAuth:
      type: http
      scheme: bearer
      description: 小程序用户会话 token（user 域，与 admin 不可互用）
  responses:
    Platform:
      description: 公开元数据；已实现上下文为 partial，其余 planned
      content:
        application/json:
          schema:
            type: object
            required: [data, requestId]
            properties:
              requestId: { type: string }
              data: { $ref: '#/components/schemas/PlatformInfo' }
    AdminProduct:
      description: 商品详情（后台）
      content:
        application/json:
          schema:
            type: object
            required: [data, requestId]
            properties:
              requestId: { type: string }
              data: { $ref: '#/components/schemas/AdminProductView' }
    MediaAsset:
      description: 图片资源
      content:
        application/json:
          schema:
            type: object
            required: [data, requestId]
            properties:
              requestId: { type: string }
              data: { $ref: '#/components/schemas/MediaAssetView' }
    Error400:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error401:
      description: 未认证
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error404:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error503:
      description: 依赖未就绪（如微信支付渠道未配置）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error409:
      description: 状态冲突 / 不可上架（details 为原因清单）/ 图片被引用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error413:
      description: 文件超过大小限制
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error415:
      description: 格式不支持或不可解码
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error429:
      description: 尝试过于频繁
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error403:
      description: 无权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AdminUser:
      description: 用户视图（脱敏）
      content:
        application/json:
          schema:
            type: object
            required: [data, requestId]
            properties:
              requestId: { type: string }
              data: { $ref: '#/components/schemas/AdminUserListItem' }
    MiniAddress:
      description: 地址视图
      content:
        application/json:
          schema:
            type: object
            required: [data, requestId]
            properties:
              requestId: { type: string }
              data: { $ref: '#/components/schemas/AddressView' }
  schemas:
    AfterSalesActionRequest: {"type":"object","required":["id","ticketId","orderId","kind","status","reason","payload","createdAt"],"properties":{"id":{"type":"string","format":"uuid"},"ticketId":{"type":"string","format":"uuid"},"orderId":{"type":"string","format":"uuid"},"kind":{"type":"string","enum":["refund","reshipment"]},"status":{"type":"string","enum":["pending","executed","rejected"]},"reason":{"type":"string","minLength":1,"maxLength":1000},"payload":{"type":"object"},"amountFen":{"type":"integer","nullable":true,"description":"退款为实付全额分，补发为null"},"reviewReason":{"type":"string","nullable":true},"resultId":{"type":"string","format":"uuid","nullable":true},"createdAt":{"type":"string","format":"date-time"},"reviewedAt":{"type":"string","format":"date-time","nullable":true},"requesterId":{"type":"string","format":"uuid"},"reviewerId":{"type":"string","format":"uuid","nullable":true}},"description":"用户工单详情 requests 不包含 requesterId/reviewerId；executed 表示退款请求或补发包裹已创建，不能表示退款到账"}
    PlatformInfo:
      type: object
      required: [name, stage, backend, database, contexts, businessReady]
      properties:
        name: { type: string }
        stage: { type: string, enum: [foundation] }
        backend: { type: string, enum: [NestJS / TypeScript] }
        database: { type: string, enum: [PostgreSQL] }
        businessReady: { type: boolean, enum: [false] }
        contexts:
          type: array
          items:
            type: object
            required: [key, name, description, status]
            properties:
              key: { type: string }
              name: { type: string }
              description: { type: string }
              status: { type: string, enum: [planned, partial] }
    HealthResponse:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data:
          type: object
          required: [status, checkedAt]
          properties:
            status: { type: string, enum: [live, ready] }
            checkedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        details:
          type: array
          items: { type: string }
    AdminProfile:
      type: object
      required: [id, username, displayName, role, permissions]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [super_admin, catalog_admin, cs_agent, cs_supervisor] }
        permissions:
          type: array
          items: { type: string, enum: [catalog:manage, inventory:manage, media:manage, admin:manage, user:manage, order:manage, agent:manage, agent:supervise] }
    LoginResponse:
      type: object
      required: [token, expiresAt, admin]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        admin: { $ref: '#/components/schemas/AdminProfile' }
    MediaFormat:
      type: string
      enum: [jpeg, png, webp]
    MediaAssetView:
      type: object
      required: [id, url, format, width, height, sizeBytes, createdAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        format: { $ref: '#/components/schemas/MediaFormat' }
        width: { type: integer }
        height: { type: integer }
        sizeBytes: { type: integer }
        createdAt: { type: string, format: date-time }
    MediaAssetAdminView:
      allOf:
        - $ref: '#/components/schemas/MediaAssetView'
        - type: object
          required: [referencedByProducts]
          properties:
            referencedByProducts: { type: integer }
    ShareUnits:
      type: integer
      enum: [30, 20, 15, 12]
      description: 60 单位制份额（1/2=30、1/3=20、1/4=15、1/5=12）
    ShareOptionView:
      type: object
      required: [units, fractionLabel, quantityText, referencePriceFen]
      properties:
        units: { $ref: '#/components/schemas/ShareUnits' }
        fractionLabel: { type: string, example: "1/3" }
        quantityText: { type: string, example: "3.333", description: 展示舍入 ≤3 位小数，非履约规则 }
        referencePriceFen: { type: integer, description: 参考价（half-up 到分），非支付报价 }
    ProductStatus:
      type: string
      enum: [draft, on_shelf, off_shelf]
    ProductStockStatus:
      type: string
      enum: [available, sold_out]
    ProductImageView:
      type: object
      required: [mediaId, url, role, sortOrder]
      properties:
        mediaId: { type: string, format: uuid }
        url: { type: string }
        role: { type: string, enum: [main, detail] }
        sortOrder: { type: integer }
    AdminProductView:
      type: object
      required: [id, name, description, originalPriceFen, userWholePriceFen, wholeQuantity, unit, allowedShareUnits, shareOptions, status, stockStatus, availableWholeItems, detailImages, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
