openapi: 3.0.3
info:
  title: 拼单平台接口
  version: 0.2.0
  description: |
    T001：框架元数据与健康检查。
    T002：后台身份权限、商品图片、商品库存管理、小程序商品展示。
    金额一律整数分；数量为十进制字符串（≤3 位小数）；时间 ISO 8601 UTC；
    分页 page 从 1 起，pageSize 默认 10、上限 50；响应包络 {data, requestId}，错误 {code, message, requestId, details?}。
servers:
  - url: http://127.0.0.1:3000
    description: 本地联调
paths:
  /api/health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: 进程存活，与数据库状态无关
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /api/health/ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: 实际 PostgreSQL 查询成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: 数据库不可达或超时
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/health/openapi:
    get:
      operationId: getFrameworkContract
      responses:
        '200':
          description: 本文档 YAML
          content:
            application/yaml:
              schema: { type: string }
  /api/mini/v1/platform:
    get:
      operationId: getMiniPlatform
      responses:
        '200': { $ref: '#/components/responses/Platform' }
  /api/admin/v1/platform:
    get:
      operationId: getAdminPlatform
      responses:
        '200': { $ref: '#/components/responses/Platform' }
  /api/admin/v1/auth/login:
    post:
      operationId: loginAdmin
      summary: 管理员登录（失败统一话术；限流 429）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 128 }
                password: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 登录成功；token 仅本次返回
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Error401' }
        '429': { $ref: '#/components/responses/Error429' }
  /api/admin/v1/auth/logout:
    post:
      operationId: logoutAdmin
      security: [{ bearerAuth: [] }]
      summary: 登出（幂等）
      responses:
        '200':
          description: 会话已撤销
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [revoked]
                    properties:
                      revoked: { type: boolean }
        '401': { $ref: '#/components/responses/Error401' }
  /api/admin/v1/auth/me:
    get:
      operationId: getAdminMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 当前管理员资料
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data: { $ref: '#/components/schemas/AdminProfile' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/admin/v1/media:
    post:
      operationId: uploadMediaAsset
      security: [{ bearerAuth: [] }]
      summary: 上传商品图片（multipart 字段 file；≤5MiB；JPEG/PNG/WebP；服务端校验魔数与尺寸）
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 资源已就绪
          content:
            application/json:
              schema: { $ref: '#/components/responses/MediaAsset' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '413': { $ref: '#/components/responses/Error413' }
        '415': { $ref: '#/components/responses/Error415' }
    get:
      operationId: listMediaAssets
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: 图片库分页（含商品引用计数）
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [items, page, pageSize, total]
                    properties:
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/MediaAssetAdminView' }
  /api/admin/v1/media/{id}:
    delete:
      operationId: deleteMediaAsset
      security: [{ bearerAuth: [] }]
      summary: 删除未被引用的图片资源（被引用返回 409）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [deleted]
                    properties:
                      deleted: { type: boolean }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
  /api/media/v1/assets/{id}:
    get:
      operationId: readMediaAsset
      summary: 公开读取图片（仅 ready 资源；长缓存）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 图片二进制
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Error404' }
  /api/admin/v1/products:
    get:
      operationId: listAdminProducts
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, on_shelf, off_shelf] } }
        - { name: keyword, in: query, schema: { type: string, minLength: 1, maxLength: 60 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: 商品分页
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [items, page, pageSize, total]
                    properties:
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminProductListItem' }
    post:
      operationId: createProduct
      security: [{ bearerAuth: [] }]
      summary: 创建草稿商品（与初始库存同一事务）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
      responses:
        '201':
          description: 已创建草稿
          content:
            application/json:
              schema: { $ref: '#/components/responses/AdminProduct' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/admin/v1/products/{id}:
    get:
      operationId: getAdminProduct
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/AdminProduct' }
        '404': { $ref: '#/components/responses/Error404' }
    patch:
      operationId: updateProduct
      security: [{ bearerAuth: [] }]
      summary: 编辑商品（字段与图片关联全量替换）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminProduct' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/admin/v1/products/{id}/publish:
    post:
      operationId: publishProduct
      security: [{ bearerAuth: [] }]
      summary: 上架（条件不满足返回 409 与原因清单；已上架幂等）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/AdminProduct' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
  /api/admin/v1/products/{id}/unpublish:
    post:
      operationId: unpublishProduct
      security: [{ bearerAuth: [] }]
      summary: 下架（幂等）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/AdminProduct' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/admin/v1/products/{id}/stock-adjustments:
    post:
      operationId: adjustStock
      security: [{ bearerAuth: [] }]
      summary: 库存调整（delta 或 setTo 二选一 + 原因；requestId 幂等键可选；负余额 409）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockAdjustmentRequest' }
      responses:
        '200':
          description: 调整结果或幂等重放
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data: { $ref: '#/components/schemas/StockAdjustmentResult' }
        '400': { $ref: '#/components/responses/Error400' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
  /api/admin/v1/products/{id}/stock-movements:
    get:
      operationId: listStockMovements
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: 变动历史分页
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [items, page, pageSize, total]
                    properties:
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/StockMovementView' }
  /api/mini/v1/products:
    get:
      operationId: listMiniProducts
      summary: 小程序商品列表（仅上架；无鉴权）
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: 上架商品分页
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [items, page, pageSize, total]
                    properties:
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/MiniProductListItem' }
  /api/mini/v1/products/{id}:
    get:
      operationId: getMiniProduct
      summary: 小程序商品详情（非上架 404）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 商品详情
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data: { $ref: '#/components/schemas/MiniProductView' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/mini/v1/auth/login:
    post:
      operationId: miniWechatLogin
      summary: 微信登录（code2Session 服务端校验；凭据未配置返回 503 WECHAT_NOT_CONFIGURED）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: 登录成功（isNewUser 标识首次建户）
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data: { $ref: '#/components/schemas/MiniLoginResponse' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '502':
          description: 微信服务不可用（WECHAT_UNAVAILABLE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: 微信登录未配置（WECHAT_NOT_CONFIGURED）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/mini/v1/auth/me:
    get:
      operationId: getMiniMe
      security: [{ miniUserAuth: [] }]
      responses:
        '200':
          description: 当前用户（手机号脱敏）
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data: { $ref: '#/components/schemas/MiniUserView' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/mini/v1/auth/logout:
    post:
      operationId: miniLogout
      security: [{ miniUserAuth: [] }]
      summary: 登出（仅撤销当前会话；幂等）
      responses:
        '200':
          description: 已撤销
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [revoked]
                    properties:
                      revoked: { type: boolean }
        '401': { $ref: '#/components/responses/Error401' }
  /api/mini/v1/auth/profile:
    patch:
      operationId: updateMiniProfile
      security: [{ miniUserAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: { type: string, minLength: 1, maxLength: 30 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data: { $ref: '#/components/schemas/MiniUserView' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/mini/v1/auth/phone:
    post:
      operationId: bindMiniPhone
      security: [{ miniUserAuth: [] }]
      summary: 绑定手机号（微信手机号组件 code 换取；服务端验证事实）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: 绑定成功
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [hasPhone, phoneMasked, phoneVerified]
                    properties:
                      hasPhone: { type: boolean, enum: [true] }
                      phoneMasked: { type: string }
                      phoneVerified: { type: boolean, enum: [true] }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/mini/v1/addresses:
    get:
      operationId: listMiniAddresses
      security: [{ miniUserAuth: [] }]
      responses:
        '200':
          description: 自己的地址（默认在前）
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AddressView' }
        '401': { $ref: '#/components/responses/Error401' }
    post:
      operationId: createMiniAddress
      security: [{ miniUserAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressSaveRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data: { $ref: '#/components/schemas/AddressView' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '409':
          description: 超过 20 条上限（ADDRESS_LIMIT_REACHED）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/mini/v1/addresses/{id}:
    patch:
      operationId: updateMiniAddress
      security: [{ miniUserAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressSaveRequest' }
      responses:
        '200': { $ref: '#/components/responses/MiniAddress' }
        '404': { $ref: '#/components/responses/Error404' }
    delete:
      operationId: deleteMiniAddress
      security: [{ miniUserAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [deleted]
                    properties:
                      deleted: { type: boolean }
        '404': { $ref: '#/components/responses/Error404' }
  /api/mini/v1/addresses/{id}/default:
    put:
      operationId: setDefaultMiniAddress
      security: [{ miniUserAuth: [] }]
      summary: 设默认（并发唯一；幂等）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 刷新后的地址列表
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AddressView' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/admin/v1/users:
    get:
      operationId: listAdminUsers
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: keyword, in: query, schema: { type: string, maxLength: 30 } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: 用户分页（手机号脱敏）
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [items, page, pageSize, total]
                    properties:
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminUserListItem' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/admin/v1/users/{id}:
    get:
      operationId: getAdminUser
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 用户详情（脱敏）
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data: { $ref: '#/components/schemas/AdminUserListItem' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/admin/v1/users/{id}/phone:
    get:
      operationId: revealAdminUserPhone
      security: [{ bearerAuth: [] }]
      summary: 查看完整手机号（强制审计 user.phone_revealed）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 手机号原文（已审计）
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [phone, countryCode]
                    properties:
                      phone: { type: string }
                      countryCode: { type: string }
        '404': { $ref: '#/components/responses/Error404' }
  /api/admin/v1/users/{id}/disable:
    post:
      operationId: disableAdminUser
      security: [{ bearerAuth: [] }]
      summary: 禁用（撤销全部会话；审计；幂等）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/AdminUser' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/admin/v1/users/{id}/enable:
    post:
      operationId: enableAdminUser
      security: [{ bearerAuth: [] }]
      summary: 启用（审计；幂等）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/AdminUser' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/mini/v1/orders:
    post:
      operationId: placeMiniOrder
      security: [{ bearerAuth: [] }]
      summary: 提交订单（预占份额；幂等键防重复建单）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, units, addressId, idempotencyKey]
              properties:
                productId: { type: string, format: uuid }
                units: { type: integer, description: 60 单位制份额（30/20/15/12 为常见整除选项；以商品配置为准）, minimum: 1, maximum: 59 }
                addressId: { type: string, format: uuid }
                idempotencyKey: { type: string, maxLength: 64 }
      responses:
        '201':
          description: 已建单并预占（金额以后端快照为权威）
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data: { $ref: '#/components/schemas/MiniOrderPlaced' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
    get:
      operationId: listMyMiniOrders
      security: [{ bearerAuth: [] }]
      summary: 我的订单列表
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: 分页订单列表
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [items, page, pageSize, total]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/MiniOrderView' } }
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Error401' }
  /api/mini/v1/orders/{id}:
    get:
      operationId: getMyMiniOrder
      security: [{ bearerAuth: [] }]
      summary: 订单详情（本人订单；他人订单一律 404）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 订单视图
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data: { $ref: '#/components/schemas/MiniOrderView' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/mini/v1/orders/{id}/cancel:
    post:
      operationId: cancelMyMiniOrder
      security: [{ bearerAuth: [] }]
      summary: 取消订单（未支付释放份额；已支付且组进行中→原路全额退款，D007/D008）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 已受理取消
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [cancelled]
                    properties:
                      cancelled: { type: boolean }
                      refundId: { type: string, format: uuid, description: 已支付取消时返回（若有） }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
  /api/mini/v1/orders/{id}/pay:
    post:
      operationId: payMiniOrder
      security: [{ bearerAuth: [] }]
      summary: 发起微信支付（幂等；返回 wx.requestPayment 参数；渠道未配置 503）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 调起参数或结果未知（不在此接口判定支付成功）
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data: { $ref: '#/components/schemas/PayInitiation' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '503': { $ref: '#/components/responses/Error503' }
  /api/mini/v1/orders/{id}/payment-result:
    post:
      operationId: queryMiniPaymentResult
      security: [{ bearerAuth: [] }]
      summary: 支付结果查询（以后端订单状态为准；前端回调不可靠）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 订单最新视图
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data: { $ref: '#/components/schemas/MiniOrderView' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/mini/v1/orders/{id}/refunds:
    get:
      operationId: listMyOrderRefunds
      security: [{ bearerAuth: [] }]
      summary: 本单退款进度（仅本人订单）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 退款记录列表
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/MiniRefundView' } }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/admin/v1/orders:
    get:
      operationId: listAdminOrders
      security: [{ bearerAuth: [] }]
      summary: 后台订单列表（order:manage）
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [unpaid, paid, cancelled, expired] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: 分页订单列表（昵称投影；手机号脱敏）
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [items, total]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AdminOrderListItem' } }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/admin/v1/orders/{id}:
    get:
      operationId: getAdminOrder
      security: [{ bearerAuth: [] }]
      summary: 后台订单详情（order:manage）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 订单详情
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data: { $ref: '#/components/schemas/MiniOrderView' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/admin/v1/groups:
    get:
      operationId: listAdminGroups
      security: [{ bearerAuth: [] }]
      summary: 后台拼单组列表（order:manage）
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, success, failed] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: 分页拼单组列表
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [items, total]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AdminGroupListItem' } }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/admin/v1/payments:
    get:
      operationId: listAdminPayments
      security: [{ bearerAuth: [] }]
      summary: 后台支付单列表（order:manage）
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [created, processing, unknown, succeeded, closed] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: 分页支付单列表
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [items, total]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AdminPaymentListItem' } }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/admin/v1/refunds:
    get:
      operationId: listAdminRefunds
      security: [{ bearerAuth: [] }]
      summary: 后台退款单列表（order:manage）
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [requested, submitted, processing, succeeded, failed] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: 分页退款单列表
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [items, total]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AdminRefundListItem' } }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/admin/v1/payment-anomalies:
    get:
      operationId: getAdminPaymentAnomalies
      security: [{ bearerAuth: [] }]
      summary: 支付/退款异常计数（人工处理入口数据源；order:manage）
      responses:
        '200':
          description: 异常计数
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data: { $ref: '#/components/schemas/PaymentAnomaliesView' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/admin/v1/refunds/{id}/retry:
    post:
      operationId: retryAdminRefund
      security: [{ bearerAuth: [] }]
      summary: 失败退款人工重试（仅 failed 且未超上限；重置为 requested 由退款驱动按幂等键重新提交；写操作审计；order:manage）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: 已重新进入退款驱动
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, enum: [requested] }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
  /api/payments/v1/notify:
    post:
      operationId: wechatPayNotify
      summary: 微信支付回调（微信服务器调用；Wechatpay-Serial/Signature/Timestamp/Nonce 头验签 + APIv3 AES-256-GCM 解密 + 幂等应用；验签失败 400）
      security: []
      parameters:
        - { name: Wechatpay-Serial, in: header, required: true, schema: { type: string } }
        - { name: Wechatpay-Signature, in: header, required: true, schema: { type: string } }
        - { name: Wechatpay-Timestamp, in: header, required: true, schema: { type: string } }
        - { name: Wechatpay-Nonce, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource]
              properties:
                id: { type: string }
                event_type: { type: string, example: TRANSACTION.SUCCESS }
                resource:
                  type: object
                  required: [ciphertext, nonce, associated_data]
                  properties:
                    ciphertext: { type: string, description: APIv3 密钥 AEAD_AES_256_GCM 密文（base64，tag 后置 16 字节） }
                    nonce: { type: string }
                    associated_data: { type: string }
      responses:
        '200': { description: 已受理（幂等；重复通知返回同样成功） }
        '400': { $ref: '#/components/responses/Error400' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 管理员会话 token（admin 域）
    miniUserAuth:
      type: http
      scheme: bearer
      description: 小程序用户会话 token（user 域，与 admin 不可互用）
  responses:
    Platform:
      description: 公开元数据；已实现上下文为 partial，其余 planned
      content:
        application/json:
          schema:
            type: object
            required: [data, requestId]
            properties:
              requestId: { type: string }
              data: { $ref: '#/components/schemas/PlatformInfo' }
    AdminProduct:
      description: 商品详情（后台）
      content:
        application/json:
          schema:
            type: object
            required: [data, requestId]
            properties:
              requestId: { type: string }
              data: { $ref: '#/components/schemas/AdminProductView' }
    MediaAsset:
      description: 图片资源
      content:
        application/json:
          schema:
            type: object
            required: [data, requestId]
            properties:
              requestId: { type: string }
              data: { $ref: '#/components/schemas/MediaAssetView' }
    Error400:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error401:
      description: 未认证
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error404:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error503:
      description: 依赖未就绪（如微信支付渠道未配置）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error409:
      description: 状态冲突 / 不可上架（details 为原因清单）/ 图片被引用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error413:
      description: 文件超过大小限制
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error415:
      description: 格式不支持或不可解码
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error429:
      description: 尝试过于频繁
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error403:
      description: 无权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AdminUser:
      description: 用户视图（脱敏）
      content:
        application/json:
          schema:
            type: object
            required: [data, requestId]
            properties:
              requestId: { type: string }
              data: { $ref: '#/components/schemas/AdminUserListItem' }
    MiniAddress:
      description: 地址视图
      content:
        application/json:
          schema:
            type: object
            required: [data, requestId]
            properties:
              requestId: { type: string }
              data: { $ref: '#/components/schemas/AddressView' }
  schemas:
    PlatformInfo:
      type: object
      required: [name, stage, backend, database, contexts, businessReady]
      properties:
        name: { type: string }
        stage: { type: string, enum: [foundation] }
        backend: { type: string, enum: [NestJS / TypeScript] }
        database: { type: string, enum: [PostgreSQL] }
        businessReady: { type: boolean, enum: [false] }
        contexts:
          type: array
          items:
            type: object
            required: [key, name, description, status]
            properties:
              key: { type: string }
              name: { type: string }
              description: { type: string }
              status: { type: string, enum: [planned, partial] }
    HealthResponse:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data:
          type: object
          required: [status, checkedAt]
          properties:
            status: { type: string, enum: [live, ready] }
            checkedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        details:
          type: array
          items: { type: string }
    AdminProfile:
      type: object
      required: [id, username, displayName, role, permissions]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [super_admin] }
        permissions:
          type: array
          items: { type: string, enum: [catalog:manage, inventory:manage, media:manage, admin:manage] }
    LoginResponse:
      type: object
      required: [token, expiresAt, admin]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        admin: { $ref: '#/components/schemas/AdminProfile' }
    MediaFormat:
      type: string
      enum: [jpeg, png, webp]
    MediaAssetView:
      type: object
      required: [id, url, format, width, height, sizeBytes, createdAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        format: { $ref: '#/components/schemas/MediaFormat' }
        width: { type: integer }
        height: { type: integer }
        sizeBytes: { type: integer }
        createdAt: { type: string, format: date-time }
    MediaAssetAdminView:
      allOf:
        - $ref: '#/components/schemas/MediaAssetView'
        - type: object
          required: [referencedByProducts]
          properties:
            referencedByProducts: { type: integer }
    ShareUnits:
      type: integer
      enum: [30, 20, 15, 12]
      description: 60 单位制份额（1/2=30、1/3=20、1/4=15、1/5=12）
    ShareOptionView:
      type: object
      required: [units, fractionLabel, quantityText, referencePriceFen]
      properties:
        units: { $ref: '#/components/schemas/ShareUnits' }
        fractionLabel: { type: string, example: "1/3" }
        quantityText: { type: string, example: "3.333", description: 展示舍入 ≤3 位小数，非履约规则 }
        referencePriceFen: { type: integer, description: 参考价（half-up 到分），非支付报价 }
    ProductStatus:
      type: string
      enum: [draft, on_shelf, off_shelf]
    ProductStockStatus:
      type: string
      enum: [available, sold_out]
    ProductImageView:
      type: object
      required: [mediaId, url, role, sortOrder]
      properties:
        mediaId: { type: string, format: uuid }
        url: { type: string }
        role: { type: string, enum: [main, detail] }
        sortOrder: { type: integer }
    AdminProductView:
      type: object
      required: [id, name, description, originalPriceFen, userWholePriceFen, wholeQuantity, unit, allowedShareUnits, shareOptions, status, stockStatus, availableWholeItems, detailImages, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        originalPriceFen: { type: integer, description: 整件商品原价（分） }
        userWholePriceFen: { type: integer, description: 用户端整件参考售价 = 原价 + 500 分固定服务费 }
        wholeQuantity: { type: string, description: 整件数量，≤3 位小数 }
        unit: { type: string }
        allowedShareUnits:
          type: array
          items: { $ref: '#/components/schemas/ShareUnits' }
        shareOptions:
          type: array
          items: { $ref: '#/components/schemas/ShareOptionView' }
        status: { $ref: '#/components/schemas/ProductStatus' }
        stockStatus: { $ref: '#/components/schemas/ProductStockStatus' }
        availableWholeItems: { type: integer }
        mainImage: { $ref: '#/components/schemas/ProductImageView' }
        detailImages:
          type: array
          items: { $ref: '#/components/schemas/ProductImageView' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminProductListItem:
      type: object
      required: [id, name, originalPriceFen, wholeQuantity, unit, status, stockStatus, availableWholeItems, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        originalPriceFen: { type: integer }
        wholeQuantity: { type: string }
        unit: { type: string }
        status: { $ref: '#/components/schemas/ProductStatus' }
        stockStatus: { $ref: '#/components/schemas/ProductStockStatus' }
        availableWholeItems: { type: integer }
        mainImageUrl: { type: string }
        createdAt: { type: string, format: date-time }
    CreateProductRequest:
      type: object
      required: [name, originalPriceFen, wholeQuantity, unit, allowedShareUnits, initialStockWholeItems]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 2000 }
        originalPriceFen: { type: integer, minimum: 1, maximum: 99999999 }
        wholeQuantity: { type: string, pattern: '^\d{1,9}(\.\d{1,3})?$', description: 必须 > 0 }
        unit: { type: string, minLength: 1, maxLength: 10 }
        allowedShareUnits:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ShareUnits' }
        mainImageId: { type: string, format: uuid }
        detailImageIds:
          type: array
          maxItems: 9
          items: { type: string, format: uuid }
        initialStockWholeItems: { type: integer, minimum: 0, maximum: 100000 }
    UpdateProductRequest:
      allOf:
        - $ref: '#/components/schemas/CreateProductRequest'
        - type: object
          description: 不含 initialStockWholeItems；图片关联全量替换
    StockView:
      type: object
      required: [productId, availableWholeItems, reservedWholeItems, updatedAt]
      properties:
        productId: { type: string, format: uuid }
        availableWholeItems: { type: integer }
        reservedWholeItems: { type: integer, description: 预留字段，当前恒为 0 }
        updatedAt: { type: string, format: date-time }
    StockMovementView:
      type: object
      required: [id, productId, delta, resultingAvailable, reason, createdAt]
      properties:
        id: { type: string }
        productId: { type: string, format: uuid }
        delta: { type: integer }
        resultingAvailable: { type: integer }
        reason: { type: string }
        requestId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    StockAdjustmentRequest:
      type: object
      required: [reason]
      properties:
        delta: { type: integer, minimum: -1000000, maximum: 1000000, description: 与 setTo 二选一 }
        setTo: { type: integer, minimum: 0, maximum: 1000000, description: 与 delta 二选一 }
        reason: { type: string, minLength: 1, maxLength: 200 }
        requestId: { type: string, format: uuid, description: 可选幂等键（同商品去重） }
    StockAdjustmentResult:
      type: object
      required: [stock, idempotentReplay]
      properties:
        stock: { $ref: '#/components/schemas/StockView' }
        movement: { $ref: '#/components/schemas/StockMovementView' }
        idempotentReplay: { type: boolean }
    MiniProductListItem:
      type: object
      required: [id, name, originalPriceFen, userWholePriceFen, priceFromFen, stockStatus]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mainImageUrl: { type: string }
        originalPriceFen: { type: integer }
        userWholePriceFen: { type: integer }
        priceFromFen: { type: integer, description: 最低份额参考价（分） }
        stockStatus: { $ref: '#/components/schemas/ProductStockStatus' }
    MiniProductView:
      type: object
      required: [id, name, description, detailImageUrls, originalPriceFen, userWholePriceFen, priceFromFen, wholeQuantity, unit, shareOptions, stockStatus]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        mainImageUrl: { type: string }
        detailImageUrls:
          type: array
          items: { type: string }
        originalPriceFen: { type: integer }
        userWholePriceFen: { type: integer }
        priceFromFen: { type: integer }
        wholeQuantity: { type: string }
        unit: { type: string }
        shareOptions:
          type: array
          items: { $ref: '#/components/schemas/ShareOptionView' }
        stockStatus: { $ref: '#/components/schemas/ProductStockStatus' }
    MiniLoginResponse:
      type: object
      required: [token, expiresAt, isNewUser, user]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        isNewUser: { type: boolean }
        user: { $ref: '#/components/schemas/MiniUserView' }
    MiniUserView:
      type: object
      required: [id, nickname, hasPhone, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string, maxLength: 30 }
        hasPhone: { type: boolean }
        phoneMasked: { type: string, example: "138****1234" }
        phoneVerified: { type: boolean }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
    AddressView:
      type: object
      required: [id, receiverName, phone, province, city, district, detail, isDefault, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        receiverName: { type: string, maxLength: 20 }
        phone: { type: string, description: 本人视图展示原文；后台一律脱敏 }
        province: { type: string }
        city: { type: string }
        district: { type: string }
        detail: { type: string, maxLength: 120 }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AddressSaveRequest:
      type: object
      required: [receiverName, phone, province, city, district, detail]
      properties:
        receiverName: { type: string, minLength: 1, maxLength: 20 }
        phone: { type: string, pattern: '^1[3-9][0-9]{9}$' }
        province: { type: string, minLength: 1, maxLength: 20 }
        city: { type: string, minLength: 1, maxLength: 20 }
        district: { type: string, minLength: 1, maxLength: 20 }
        detail: { type: string, minLength: 5, maxLength: 120 }
    AdminUserListItem:
      type: object
      required: [id, nickname, hasPhone, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        hasPhone: { type: boolean }
        phoneMasked: { type: string }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time }
    MiniOrderPlaced:
      type: object
      required: [id, orderNo, status, units, quote, reservationExpiresAt]
      properties:
        id: { type: string, format: uuid }
        orderNo: { type: string }
        status: { type: string, enum: [unpaid] }
        units: { type: integer }
        quote: { $ref: '#/components/schemas/OrderQuoteView' }
        reservationExpiresAt: { type: string, format: date-time }
    OrderQuoteView:
      type: object
      required: [totalAmountFen, goodsAmountFen, serviceFeeFen, tailAdjustFen, isFinalOrder]
      properties:
        totalAmountFen: { type: integer, description: 应付总额（分） }
        goodsAmountFen: { type: integer, description: 商品金额（分） }
        serviceFeeFen: { type: integer, description: 平台服务费（分，默认 500） }
        tailAdjustFen: { type: integer, description: 尾差调整（分，D006 标准价+平台让利台账） }
        isFinalOrder: { type: boolean }
    MiniOrderView:
      type: object
      required: [id, orderNo, status, units, productId, groupId, quote, productSnapshot, addressSnapshot, reservationExpiresAt, paymentNotice, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderNo: { type: string }
        status: { type: string, enum: [unpaid, paid, cancelled, expired] }
        units: { type: integer }
        productId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        quote: { $ref: '#/components/schemas/OrderQuoteView' }
        productSnapshot:
          type: object
          required: [originalPriceFen, unit, wholeQuantityText, referenceQuantityText]
          properties:
            originalPriceFen: { type: integer }
            unit: { type: string }
            wholeQuantityText: { type: string }
            referenceQuantityText: { type: string }
        addressSnapshot:
          type: object
          required: [receiverName, phone, province, city, district, detail]
          properties:
            receiverName: { type: string }
            phone: { type: string }
            province: { type: string }
            city: { type: string }
            district: { type: string }
            detail: { type: string }
        groupSummary:
          type: [object, 'null']
          properties:
            groupId: { type: string }
            status: { type: string, enum: [open, success, failed] }
            paidUnits: { type: integer }
            reservedUnits: { type: integer }
            remainingCapacity: { type: integer }
            deadline: { type: string, format: date-time }
        reservationExpiresAt: { type: string, format: date-time }
        paymentNotice: { type: string, description: 渠道未配置时的提示；已配置为空串 }
        createdAt: { type: string, format: date-time }
    PayInitiation:
      type: object
      required: [paymentId, status]
      properties:
        paymentId: { type: string, format: uuid }
        status: { type: string, enum: [processing, unknown], description: processing=返回调起参数；unknown=渠道结果未定，稍后用 payment-result 查询 }
        payParams:
          type: object
          required: [timeStamp, nonceStr, package, signType, paySign]
          description: wx.requestPayment 参数（RSA）
          properties:
            timeStamp: { type: string }
            nonceStr: { type: string }
            package: { type: string, example: prepay_id=wx201... }
            signType: { type: string, enum: [RSA] }
            paySign: { type: string }
        message: { type: string }
    MiniRefundView:
      type: object
      required: [id, status, amountFen, reason, createdAtText]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [requested, submitted, processing, succeeded, failed] }
        amountFen: { type: integer }
        reason: { type: string, enum: [user_cancel, group_failed, late_payment] }
        createdAtText: { type: string, format: date-time }
    AdminOrderListItem:
      type: object
      required: [id, orderNo, status, units, nickname, totalAmountFen, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderNo: { type: string }
        status: { type: string, enum: [unpaid, paid, cancelled, expired] }
        units: { type: integer }
        nickname: { type: string }
        totalAmountFen: { type: integer }
        createdAt: { type: string, format: date-time }
    AdminGroupListItem:
      type: object
      required: [id, productId, status, paidUnits, reservedUnits, remainingCapacity, deadline, createdAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        status: { type: string, enum: [open, success, failed] }
        paidUnits: { type: integer }
        reservedUnits: { type: integer }
        remainingCapacity: { type: integer }
        deadline: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    AdminPaymentListItem:
      type: object
      required: [id, orderNo, status, amountFen, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderNo: { type: string }
        status: { type: string, enum: [created, processing, unknown, succeeded, closed] }
        amountFen: { type: integer }
        channelTransactionId: { type: string }
        appliedResult: { type: string, enum: [applied, refunded_not_applied, pending_review] }
        createdAt: { type: string, format: date-time }
    AdminRefundListItem:
      type: object
      required: [id, orderNo, nickname, amountFen, status, reason, retryCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderNo: { type: string }
        nickname: { type: string }
        amountFen: { type: integer }
        status: { type: string, enum: [requested, submitted, processing, succeeded, failed] }
        reason: { type: string, enum: [user_cancel, group_failed, late_payment] }
        retryCount: { type: integer }
        failReason: { type: string }
        createdAt: { type: string, format: date-time }
    PaymentAnomaliesView:
      type: object
      required: [pendingReviewPayments, failedRefunds]
      properties:
        pendingReviewPayments: { type: integer, description: 金额核验不一致待人工复核的支付单数 }
        failedRefunds: { type: integer, description: 退款失败待处理单数 }
