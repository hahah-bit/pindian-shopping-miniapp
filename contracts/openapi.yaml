      security: [{ bearerAuth: [] }]
      summary: 正常发货（最小履约单位；数量守恒；isReissue:true 返回409 REVIEW_REQUIRED）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantityGrams, company, trackingNo]
              properties:
                quantityGrams: { type: integer, minimum: 1, description: 本次寄发数量（最小单位，重量为克、计数为商品单位） }
                company: { type: string, maxLength: 30 }
                trackingNo: { type: string, maxLength: 64 }
                isReissue: { type: boolean, default: false, description: 兼容字段；true返回409 REVIEW_REQUIRED，补发请使用售后审批 }
