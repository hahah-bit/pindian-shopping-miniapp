      responses:
        '201':
          description: 已发货
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [shipmentId, fulfillmentOrder]
                    properties:
                      shipmentId: { type: string, format: uuid }
                      fulfillmentOrder:
                        type: object
                        required: [id, status, shippedQuantityGrams]
                        properties:
                          id: { type: string, format: uuid }
                          status: { type: string, enum: [pending_shipment, partially_shipped, shipped, completed] }
                          shippedQuantityGrams: { type: integer }
